[package]
name = "integrations"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.12.0", features = ["json", "blocking", "stream"] }
tracing = "0.1.0"
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
chrono = "0.4.0"
tokio = { version = "1.47.0", features = ["time", "sync"] }
bytes = "1.10.1"
futures-util = "0.3.31"
async-trait = "0.1"
openrouter-rs = "0.22"

[dev-dependencies]
tokio = { version = "1.47.0", features = ["macros", "rt"] }
serde_yaml = "0.9.0"
chrono = "0.4.0"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
